name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  git-2-20:
    name: Worktrees on git 2.20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the gitwt test binary
        run: go test -c -o "$RUNNER_TEMP/gitwt.test" ./internal/gitwt
      - name: Test with git 2.20.1
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/gitwt.test:/gitwt.test:ro" \
            debian:buster \
            sh -eu -c '
              echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
              command -v git
              git --version
              test "$(git --version)" = "git version 2.20.1"
              /gitwt.test -test.v
            '

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all release targets
        run: scripts/build-all.sh

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the schema validator
        run: python3 -m pip install --user 'jsonschema==4.26.0'
      - name: Validate the schemas and examples against docs/protocol.md
        run: python3 scripts/validate-schemas.py
      - name: Apply the store migrations and run the smoke checks
        run: python3 scripts/check-migrations.py
